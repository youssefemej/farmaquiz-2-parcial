<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FarmaQuiz · Farmacología (2.º parcial y enero)</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2233;--muted:#6b7491;--line:#e3e7f1;--brand:#4f6bed;--brand-ink:#fff;--ok:#12a36b;--ok-bg:#e2f6ee;--ko:#e5484d;--ko-bg:#fdeaea;--warn:#e8a317;--warn-bg:#fff6e0;--shadow:0 6px 24px rgba(30,40,90,.07)}
[data-theme=dark]{--bg:#0f1320;--card:#181d2e;--ink:#e8ebf6;--muted:#97a0bd;--line:#2a3150;--brand:#7b93ff;--brand-ink:#0f1320;--ok:#3ccf91;--ok-bg:#12332a;--ko:#ff7276;--ko-bg:#3a1c22;--warn:#f0b53a;--warn-bg:#3a2f14;--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
header.top h1{margin:0;font-size:1.3rem;letter-spacing:-.01em}
header.top small{display:block;color:var(--muted);font-size:.8rem}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.icon-btn svg{width:20px;height:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{margin:0 0 8px;font-size:1.1rem}
.tabs{display:flex;gap:6px;padding:5px;margin-bottom:14px;border:1px solid var(--line);background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.tabs button{flex:1;font:inherit;font-weight:650;font-size:.9rem;border:0;background:transparent;color:var(--muted);padding:11px 6px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--brand);color:var(--brand-ink);box-shadow:0 6px 16px rgba(79,107,237,.28)}
.cbadge{background:var(--ko);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 7px;min-width:20px;text-align:center}
.cbadge.zero{display:none}
.live{width:8px;height:8px;border-radius:50%;background:var(--warn);display:none}.live.on{display:inline-block}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0;max-width:100%;flex:1 1 180px}
input[type=number]{flex:0 1 90px}
.btn{font:inherit;font-weight:650;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{background:var(--ko);color:#fff;border-color:var(--ko)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.35rem}.stat span{color:var(--muted);font-size:.78rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}.b-ok{background:var(--ok)}.b-ko{background:var(--ko)}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.progress-top small{color:var(--muted)}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tag{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);border-radius:99px;font-size:.74rem;font-weight:700;padding:3px 10px}
.qnum{color:var(--muted);font-size:.8rem}
.qtext{font-size:1.12rem;margin:0 0 14px;line-height:1.4}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .ltr{flex:none;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.right .ltr{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ko);background:var(--ko-bg)}.opt.wrong .ltr{background:var(--ko);color:#fff}
.opt.dim{opacity:.65}.opt:disabled{cursor:default}
.actions{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}.actions .sp{flex:1}
.hint{color:var(--muted);font-size:.82rem;margin:10px 0 0}
.fb{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fb-head{display:flex;gap:10px;align-items:center;padding:12px 14px;font-weight:700}
.fb-head svg{width:22px;height:22px;flex:none}
.fb-head.ok{background:var(--ok-bg);color:var(--ok)}.fb-head.ko{background:var(--ko-bg);color:var(--ko)}.fb-head.bl{background:var(--warn-bg);color:var(--warn)}
.fb-body{padding:6px 14px 14px}.fb-body h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
.fb-body p{margin:0}
.note{display:flex;gap:8px;background:var(--warn-bg);border-radius:12px;padding:10px 12px;margin:12px 0 0;font-size:.92rem}
.note svg{width:20px;height:20px;flex:none;color:var(--warn);margin-top:2px}
ul.why{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.why li{display:flex;gap:10px;font-size:.93rem}ul.why li.picked{background:var(--ko-bg);border-radius:10px;padding:6px 8px;margin:-6px -8px}
ul.why .l{flex:none;width:24px;height:24px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:.78rem}
ul.why .o{display:block;font-weight:650;margin-bottom:2px}
.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:'▾';color:var(--muted);transition:transform .2s;margin-left:auto}.fold:not([open])>summary::after{transform:rotate(-90deg)}
.fold>summary small{color:var(--muted);margin-left:8px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.gcell{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;font-weight:650;cursor:pointer}
.gcell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}.gcell.ko{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.gcell.cur{outline:2px solid var(--brand);outline-offset:1px}.gcell.fl{box-shadow:inset 0 -4px 0 var(--warn)}.gcell.sel{background:color-mix(in srgb,var(--brand) 18%,transparent);border-color:var(--brand)}
.sim-h{margin:4px 0 6px;font-size:1.3rem}.sim-p{margin:0 0 14px;color:var(--muted)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.cfg label{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}.cfg select,.cfg input{flex:none;width:100%}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.ringbox{position:relative;width:120px;height:120px}.ringbox svg{width:100%;height:100%}
.ringbox .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ringbox .n b{font-size:1.5rem;line-height:1}.ringbox .n span{font-size:.72rem;color:var(--muted)}
.hero .tx h2{margin:0 0 4px;font-size:1.25rem}.hero .tx p{margin:0 0 4px;color:var(--muted)}
.weak{display:grid;gap:8px}.wrow{display:grid;grid-template-columns:1fr 160px 52px;gap:10px;align-items:center;font-size:.88rem}
.sbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}.sbar i{display:block;height:100%}.sbar .g{background:var(--ok)}.sbar .r{background:var(--ko)}.sbar .n{background:transparent}
.wrow .pc{text-align:right;color:var(--muted)}
.rline{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.empty{text-align:center;color:var(--muted)}.empty h2{color:var(--ink)}
.xbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.xbar .sp{flex:1}.timer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--line);border-radius:10px;padding:5px 11px}.timer.low{background:var(--warn-bg);color:var(--warn)}.timer.crit{background:var(--ko-bg);color:var(--ko)}
.hist{display:grid;gap:8px}.hrow{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--card);color:var(--ink);font:inherit;text-align:left;width:100%}
.hrow b{font-variant-numeric:tabular-nums}
details.rv{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card)}
details.rv>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
details.rv>summary::-webkit-details-marker{display:none}
details.rv .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.75rem;font-weight:800}
details.rv .st.ok{background:var(--ok)}details.rv .st.ko{background:var(--ko)}details.rv .st.bl{background:var(--warn)}
details.rv .rvb{padding:0 14px 14px}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.55);display:none;place-items:center;padding:20px;z-index:50}.modal.on{display:grid}
.modal .box{background:var(--card);border-radius:18px;max-width:400px;width:100%;padding:22px;border:1px solid var(--line)}
.modal h2{margin:0 0 6px}.modal p{margin:0 0 18px;color:var(--muted)}.modal .row{display:flex;gap:10px;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--ink);font:inherit;padding:9px 14px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.kbd{font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--muted)}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qcard{animation:up .25s}.qcard.x{animation:none}
@media (max-width:560px){
 .wrap{padding:12px 12px 70px}.stats{grid-template-columns:repeat(2,1fr)}.qtext{font-size:1.05rem}
 .tabs{gap:3px;padding:4px}.tabs button{font-size:.68rem;padding:10px 1px;gap:3px}
 .actions .btn{flex:1 1 auto;justify-content:center}.kbd{display:none}.wrow{grid-template-columns:1fr 70px 40px}.hero{justify-content:center;text-align:center}
 .xbar{gap:6px;padding:8px}.card{padding:14px}
}
</style>
</head>

o que reduce la liberación de neurotransmisores, sean excitadores o inhibidores.", "ko": {"0": "Su mecanismo es fundamentalmente central (aunque también hay acción periférica).", "1": "Bloquear canales de sodio voltaje-dependientes es el mecanismo de los anestésicos locales.", "2": "Los opioides tienen afinidad selectiva por los receptores opioides (μ, δ, κ).", "4": "Son muy eficaces: son los analgésicos más potentes."}, "n": ""}, {"id": 6, "t": "Analgesia: AINE, opioides y anestésicos locales", "b": 1, "q": "La benzocaína:", "o": ["Es un anestésico general", "Es un anestésico local de uso exclusivamente tópico", "Es un anestésico general de uso exclusivamente tópico", "Es un anestésico local con duración de acción corta", "Es un anestésico local con duración de acción media"], "a": 1, "ok": "La benzocaína es un anestésico local de uso exclusivamente tópico (no se inyecta).", "ko": {"0": "Es un anestésico local, no general.", "2": "No es un anestésico general.", "3": "Es de duración corta, pero la clave la define por su uso tópico exclusivo, no por la duración.", "4": "No es de duración media; el rasgo que la define es su uso tópico."}, "n": ""}, {"id": 7, "t": "Hipertensión", "b": 1, "q": "Los medicamentos reducen la presión arterial mediante:", "o": ["Acciones sobre el tono venenoso", "Acciones sobre volumen sanguíneo", "Acciones sobre la resistencia periférica", "Acciones sobre el músculo liso para provocar la relajación de los vasos de resistencia", "Todas son correctas"], "a": 4, "ok": "Los fármacos antihipertensivos reducen la presión arterial actuando sobre el tono venoso, el volumen sanguíneo, la resistencia periférica y el músculo liso de los vasos de resistencia: todas son correctas.", "ko": {"0": "Es cierto, pero también lo son las demás.", "1": "Es cierto (diuréticos), pero también lo son las demás.", "2": "Es cierto, pero también lo son las demás.", "3": "Es cierto (vasodilatadores), pero también lo son las demás."}, "n": ""}, {"id": 8, "t": "Hipertensión", "b": 1, "q": "El propranolol:", "o": ["Es un bloqueante selectivo B1 (beta 1)", "Es un betabloqueante de segunda generación", "Es un bloqueante no selectivo B1 (beta 1)", "Presenta mayor CV que con los antihipertensivos de 1º línea", "C y d son correctas"], "a": 2, "ok": "El propranolol es un betabloqueante no selectivo (bloquea β1 y β2) de primera generación.", "ko": {"0": "No es selectivo β1: bloquea también β2.", "1": "Es de primera generación, no de segunda.", "3": "Los betabloqueantes tienen menor protección cardiovascular que los antihipertensivos de primera línea, no mayor.", "4": "Como la última opción incluye una falsa, no se puede marcar."}, "n": "La opción correcta está escrita «no selectivo B1» pero quiere decir no selectivo (β1 y β2)."}, {"id": 9, "t": "Hipertensión", "b": 1, "q": "Señale la respuesta correcta:", "o": ["El minoxidilo nunca se utiliza en combinación con diuréticos/betabloqueantes", "El minoxidilo presenta menor protección CV que los antihipertensivos de 1º línea", "El minoxidilo está especialmente indicado en diabéticos", "El minoxidilo presenta edema, rubor y cefalea como posibles efectos adversos entre otros", "El minoxidilo produce una acción vasoconstrictora arteriolar directa"], "a": 3, "ok": "El minoxidilo (vasodilatador directo) produce edema, rubor y cefalea, además de taquicardia refleja, retención hidrosalina e hipertricosis.", "ko": {"0": "Se usa siempre en combinación con diuréticos y betabloqueantes, nunca solo.", "1": "Es cierto en la práctica que no tiene prevención CV demostrada, pero la clave marca otra opción.", "2": "No es de elección en diabéticos: se reserva para hipertensión resistente.", "4": "Es un vasodilatador arteriolar directo, no vasoconstrictor."}, "n": "Ojo: la opción sobre «menor protección CV» también se podría defender, pero la clave es el perfil de efectos adversos."}, {"id": 10, "t": "Hipertensión", "b": 1, "q": "Señale la respuesta correcta:", "o": ["Los inhibidores del sistema renina angiotensina (SRA) están especialmente indicados en arritmias, postinfarto o angina estable.", "Los bloqueantes de canales de calcio (BCC) son antihipertensivos de 2º línea.", "Los bloqueantes alfa 1 se usan en combinación en hipertensión refractoria.", "El atenolol es betabloqueante no selectivo de 1º generación.", "El bisoprolol es betabloqueante selectivo beta 1."], "a": 4, "ok": "El bisoprolol es un betabloqueante selectivo β1 (cardioselectivo).", "ko": {"0": "Los inhibidores del SRA son de primera línea en HTA; arritmias, postinfarto o angina estable son indicaciones de betabloqueantes.", "1": "Los BCC son antihipertensivos de primera línea, no de segunda.", "2": "En la práctica los α1 se usan en combinación en hipertensión refractoria, pero la clave marca otra opción.", "3": "El atenolol es un betabloqueante selectivo β1, no no selectivo."}, "n": "Ojo: la opción sobre los bloqueantes α1 en combinación también es cierta según otros temas; la clave marca el bisoprolol."}, {"id": 11, "t": "Angina de pecho", "b": 1, "q": "El tratamiento para la prevención a largo plazo de la angina de pecho incluye:", "o": ["Nitrodilatadores.", "Beta bloqueantes y BCC.", "Ranolazina y estatinas.", "Antiagregantes plaquetarios y estatinas.", "Ninguna es correcta."], "a": 3, "ok": "En la prevención a largo plazo de la angina se usan antiagregantes plaquetarios y estatinas para reducir el riesgo de infarto.", "ko": {"0": "Los nitrodilatadores se usan para el alivio o la prevención del episodio, no como prevención a largo plazo de eventos.", "1": "Betabloqueantes y BCC reducen la demanda de oxígeno, pero no son la prevención a largo plazo en esta pregunta.", "2": "La ranolazina es una alternativa antianginosa; con las estatinas no forma la respuesta clave.", "4": "Sí hay una opción correcta."}, "n": ""}, {"id": 12, "t": "Angina de pecho", "b": 1, "q": "Señala la respuesta INCORRECTA en la angina de pecho:", "o": ["Los nitrodilatadores disminuyen la demanda de oxígeno.", "El verapamilo se usa especialmente en angina variante.", "Los efectos adversos de los nitrodilatadores incluyen hipertensión.", "La ranolazina se usa como alternativa a otros antianginosos en solitario o como terapia adicional.", "Pueden combinarse agentes de los distintos grupos en caso necesario."], "a": 2, "ok": "Los efectos adversos de los nitrodilatadores son cefalea frontal e hipotensión, no hipertensión: por eso es la opción incorrecta.", "ko": {"0": "Es correcta: reducen la precarga y, con ella, la demanda de oxígeno.", "1": "Es correcta: el verapamilo se usa especialmente en la angina variante.", "3": "Es correcta: la ranolazina se usa sola o como terapia adicional.", "4": "Es correcta: se pueden combinar grupos distintos si hace falta."}, "n": ""}, {"id": 13, "t": "Angina de pecho", "b": 1, "q": "La prevención de isquemia a largo plazo NO incluye:", "o": ["Controlar el estrés.", "Dejar el tabaco.", "Dieta.", "Antiagregantes plaquetarios.", "Estatinas."], "a": 0, "ok": "Controlar el estrés no figura entre las medidas farmacológicas ni de prevención secundaria de la isquemia señaladas en el tema.", "ko": {"1": "Sí se incluye: dejar el tabaco.", "2": "Sí se incluye: la dieta.", "3": "Sí se incluyen los antiagregantes.", "4": "Sí se incluyen las estatinas."}, "n": ""}, {"id": 14, "t": "Antitrombóticos y sangre", "b": 1, "q": "Señale la respuesta correcta:", "o": ["Los trombos blancos son más sensibles a antiagregantes plaquetarios.", "La alteplasa es inhibidor GPIIb/IIIa.", "El dabigatrán se administra por vía parenteral.", "La heparina potencia la acción de la trombina.", "Los antitrombóticos distinguen entre trombos blancos y rojos."], "a": 0, "ok": "Los trombos blancos (ricos en plaquetas, arteriales) son más sensibles a los antiagregantes plaquetarios; los rojos (ricos en fibrina, venosos), a los anticoagulantes.", "ko": {"1": "La alteplasa es un fibrinolítico (activa el plasminógeno); el inhibidor GPIIb/IIIa es la eptifibatida.", "2": "El dabigatrán se administra por vía oral.", "3": "Las heparinas potencian la acción de la antitrombina, no de la trombina.", "4": "Precisamente los antitrombóticos son diferentes según el tipo de trombo: antiagregantes en blancos, anticoagulantes en rojos."}, "n": ""}, {"id": 15, "t": "Antitrombóticos y sangre", "b": 1, "q": "El fondaparinux:", "o": ["Se administra por vía SC.", "No atraviesa placenta.", "Tiene necesidad de monitorización.", "Se obtiene de mucosa intestinal porcina.", "Da reacción cruzada con heparinas."], "a": 0, "ok": "El fondaparinux se administra por vía subcutánea.", "ko": {"1": "Sí atraviesa la placenta en pequeña cantidad; no es la opción marcada.", "2": "No necesita monitorización.", "3": "Es sintético, no se obtiene de mucosa intestinal porcina (como sí la heparina).", "4": "No da reacción cruzada con las heparinas: es la alternativa en la trombocitopenia por heparina."}, "n": ""}, {"id": 16, "t": "Antitrombóticos y sangre", "b": 1, "q": "Los factores a considerar con la warfarina incluyen:", "o": ["Su efecto está influenciado por dieta, fármacos y genes.", "Tienen un margen terapéutico estrecho.", "El efecto es lento en comenzar y en terminar.", "No se deben usar en el embarazo.", "Todas son correctas."], "a": 4, "ok": "La warfarina tiene su efecto influido por dieta, fármacos y genes, margen terapéutico estrecho, efecto lento en comenzar y terminar y está contraindicada en el embarazo: todas son correctas.", "ko": {"0": "Es cierto, pero todas las demás también lo son.", "1": "Es cierto, pero todas las demás también lo son.", "2": "Es cierto, pero todas las demás también lo son.", "3": "Es cierto, pero todas las demás también lo son."}, "n": ""}, {"id": 17, "t": "Antitrombóticos y sangre", "b": 1, "q": "El clopidogrel:", "o": ["Bloquea reversiblemente receptor plaquetario P2Y12.", "Es un profármaco.", "Tiene efecto rápido.", "Forma puentes interplaquetarios.", "Es un inhibidor parenteral de uso hospitalario."], "a": 1, "ok": "El clopidogrel es un profármaco que se activa en el hígado y bloquea de forma irreversible el receptor plaquetario P2Y12.", "ko": {"0": "El bloqueo es irreversible, no reversible (el ticagrelor sí es reversible).", "2": "Su efecto es lento en comenzar.", "3": "Los puentes interplaquetarios los forma el fibrinógeno sobre GPIIb/IIIa; el clopidogrel no actúa ahí.", "4": "Es oral; el inhibidor parenteral hospitalario es otro tipo (cangrelor, eptifibatida)."}, "n": ""}, {"id": 18, "t": "Antitrombóticos y sangre", "b": 1, "q": "El ácido tranexámico:", "o": ["Es un inhibidor competitivo de la plasmina.", "Se administra por vía oral o IV.", "Efecto adverso: trombosis.", "Se utiliza en menorragias y para revertir ….", "Todas son correctas."], "a": 4, "ok": "El ácido tranexámico es un inhibidor competitivo de la plasmina, se da por vía oral o IV, puede producir trombosis y se usa en menorragias y hemorragias posquirúrgicas: todas son correctas.", "ko": {"0": "Es correcto, pero todas las demás también lo son.", "1": "Es correcto, pero todas las demás también lo son.", "2": "Es correcto, pero todas las demás también lo son.", "3": "Es correcto, pero todas las demás también lo son."}, "n": ""}, {"id": 19, "t": "Antitrombóticos y sangre", "b": 1, "q": "Los trombolíticos están indicados en:", "o": ["Tromboembolismo venoso.", "IM/ angina inestable.", "Angioplastia, cirugía coronaria.", "A y C son correctas.", "B y C son correctas."], "a": 4, "ok": "La clave del profesor da por correctas las dos indicaciones coronarias: IM / angina inestable y angioplastia / cirugía coronaria.", "ko": {"0": "Por sí sola no es la opción que marca la clave.", "1": "Es una de las dos indicaciones correctas, pero la clave marca la opción que la une con la angioplastia.", "2": "Es una de las dos indicaciones correctas, pero la clave marca la opción que la une con IM / angina inestable.", "3": "No: en la clave el tromboembolismo venoso no va con la angioplastia."}, "n": "Ojo: en la práctica los fibrinolíticos también se usan en el tromboembolismo venoso grave; aquí se sigue la clave del profesor."}, {"id": 20, "t": "Antitrombóticos y sangre", "b": 1, "q": "Los antiagregantes plaquetarios están indicados en:", "o": ["Angioplastia, cirugía coronaria.", "Diabetes.", "Embolia pulmonar.", "Tromboembolismo venoso.", "Hipertensión arterial."], "a": 0, "ok": "Los antiagregantes plaquetarios se indican en la angioplastia y la cirugía coronaria (prevención de la trombosis arterial).", "ko": {"1": "La diabetes no es una indicación específica.", "2": "La embolia pulmonar es un trombo venoso: se trata con anticoagulantes o fibrinolíticos.", "3": "El tromboembolismo venoso se trata con anticoagulantes.", "4": "La hipertensión arterial no es una indicación."}, "n": ""}, {"id": 21, "t": "Antitrombóticos y sangre", "b": 1, "q": "La anemia ferropénica:", "o": ["Se produce siempre en embarazo/lactancia.", "Siempre se trata en época de crecimiento.", "No se modifica con la dieta.", "Se puede tratar con gluconato férrico de sodio IV.", "B y D son correctas."], "a": 3, "ok": "El gluconato férrico de sodio IV es una de las formas de hierro parenteral para tratar la anemia ferropénica.", "ko": {"0": "No se produce siempre: depende del aporte y de las pérdidas.", "1": "No siempre se trata solo por estar en época de crecimiento.", "2": "Sí se modifica con la dieta (el hierro de la dieta y su absorción influyen).", "4": "Es falsa porque una de las dos afirmaciones (tratar siempre en crecimiento) no es correcta."}, "n": ""}, {"id": 22, "t": "Aparato digestivo", "b": 1, "q": "La colestiramina:", "o": ["No atraviesa la BHE.", "Inhibe la secreción, potencia absorción y detiene la motilidad.", "Indicada especialmente en niños.", "Tiene un uso máximo de 2 días.", "Ninguna es correcta."], "a": 4, "ok": "Ninguna es correcta: la colestiramina es una resina que fija ácidos biliares; no se absorbe y no es el fármaco que reduce la secreción ni la motilidad.", "ko": {"0": "No es la opción marcada en la clave del profesor.", "1": "Esa descripción corresponde a otros antidiarreicos, no a la colestiramina.", "2": "No es especialmente indicada en niños.", "3": "No tiene un uso máximo de 2 días."}, "n": "Ojo: es cierto que la colestiramina no se absorbe, pero la clave marca «ninguna»."}, {"id": 23, "t": "Aparato digestivo", "b": 1, "q": "El racecadotrilo:", "o": ["Está indicados en pacientes diabéticos.", "Puede presentar estreñimiento como reacción adversa.", "Solo afecta a la secreción intestinal.", "Es muy eficaz frente a C. difficile.", "Ninguna es correcta."], "a": 2, "ok": "El racecadotrilo inhibe las encefalinasas y solo afecta a la secreción intestinal, sin modificar la motilidad.", "ko": {"0": "No es una indicación específica de diabéticos.", "1": "No produce estreñimiento (esa es la ventaja frente a la loperamida).", "3": "No es muy eficaz frente a C. difficile.", "4": "Sí hay una opción correcta."}, "n": ""}, {"id": 24, "t": "Aparato digestivo", "b": 1, "q": "En el estreñimiento:", "o": ["La lactulosa produce heces blandas de 1 a 3 días.", "Los fármacos irritantes producen evacuaciones líquidas.", "La lactulosa produce heces blandas de 6 a 8 horas.", "La fibra no fermentable no tiene efecto alguno.", "El polietilenglicol produce heces blandas o semilíquidas de 6 a 8 horas."], "a": 0, "ok": "La lactulosa produce heces blandas en 24-72 horas (1 a 3 días).", "ko": {"1": "Los irritantes producen evacuaciones semilíquidas o heces blandas.", "2": "La lactulosa no actúa en horas (6-8 h).", "3": "La fibra no fermentable sí tiene efecto: aumenta el volumen.", "4": "El polietilenglicol no actúa tan rápido como en 6-8 horas."}, "n": "Ojo · aquí se sigue la clave marcada en el PDF del profesor. "}, {"id": 25, "t": "Aparato digestivo", "b": 1, "q": "La domperidona:", "o": ["Resulta útil en la émesis tardía del cisplatino.", "Puede producir alteraciones psicológicas como reacción adversa.", "Se usa como antiemético o como procinético.", "Es la 2º opción cuando fallan los anti-5-HT3.", "Ninguna es correcta."], "a": 2, "ok": "La domperidona se usa como antiemético o como procinético y no atraviesa la barrera hematoencefálica.", "ko": {"0": "No es útil en la émesis tardía del cisplatino.", "1": "No produce alteraciones psicológicas porque no atraviesa la BHE.", "3": "No es la segunda opción tras los anti-5-HT3.", "4": "Sí hay una opción correcta."}, "n": ""}, {"id": 26, "t": "Aparato digestivo", "b": 1, "q": "Los inhibidores de la secreción ácida.", "o": ["Incluyen sales de bismuto coloidal, sucralfato y análogos de las prostaglandinas.", "Presentan reacciones adversas inespecíficas y poco frecuentes.", "Ocasionan interacciones farmacocinéticas.", "Puede producir bezoar como reacción adversa.", "Ninguna es correcta."], "a": 1, "ok": "La clave marca que los inhibidores de la secreción ácida presentan reacciones adversas inespecíficas y poco frecuentes.", "ko": {"0": "Bismuto, sucralfato y análogos de prostaglandinas son protectores de la mucosa.", "2": "La clave no la marca.", "3": "El bezoar es una reacción adversa de otro grupo (sucralfato).", "4": "Sí hay una opción correcta."}, "n": "Ojo · aquí se sigue la clave marcada en el PDF del profesor. En la práctica los IBP también tienen interacciones, pero la clave marca esta opción."}, {"id": 27, "t": "Epilepsia y Parkinson", "b": 1, "q": "En la epilepsia parcial:", "o": ["Siempre se produce una pérdida de la consciencia.", "Se dan alteraciones en movimiento/ sensación/ consciencia.", "Se produce una afectación general de la movilidad.", "Las manifestaciones dependen de la zona afectada.", "B y D son correctas."], "a": 4, "ok": "En la epilepsia parcial hay alteraciones del movimiento, la sensibilidad o la consciencia, y las manifestaciones dependen de la zona afectada.", "ko": {"0": "No siempre se pierde la consciencia (en la parcial simple se conserva).", "1": "Es cierta, pero la clave marca la opción que la agrupa con la correcta restante.", "2": "No hay afectación general: eso es la epilepsia generalizada.", "3": "Es cierta, pero la clave marca la opción que la agrupa con la otra correcta."}, "n": ""}, {"id": 28, "t": "Epilepsia y Parkinson", "b": 1, "q": "La carbamacepina:", "o": ["Es útil en crisis de ausencias.", "Potencia los receptores tipo GABA.", "Es un bloqueante de los canales de sodio.", "Puede producir cálculos renales como reacción adversa.", "Se administra por vía intramuscular."], "a": 2, "ok": "La carbamazepina es un bloqueante de los canales de sodio dependientes de voltaje.", "ko": {"0": "No es útil en las ausencias (puede empeorarlas).", "1": "Potenciar los receptores GABA es el mecanismo de benzodiazepinas y barbitúricos.", "3": "Los cálculos renales son una reacción adversa del topiramato.", "4": "No se administra por vía intramuscular."}, "n": ""}, {"id": 29, "t": "Epilepsia y Parkinson", "b": 1, "q": "El ropinirol:", "o": ["Es especialmente útil en pacientes de enfermedad de Parkinson que sufren fenómenos on-off.", "Es un inhibidor de la degradación de la dopamina.", "Por retirada de tratamiento puede producir ataxia.", "Es un agonista irreversible D2", "Es un antagonista D3"], "a": 0, "ok": "La clave del profesor marca como correcta su utilidad en los pacientes de Parkinson con fenómenos on-off.", "ko": {"1": "Inhibir la degradación de la dopamina es el mecanismo de los IMAO-B y de los inhibidores de COMT.", "2": "No es la opción marcada en la clave.", "3": "No es un agonista irreversible ni un antagonista: es un agonista dopaminérgico D2/D3.", "4": "No es un antagonista: es un agonista dopaminérgico."}, "n": "Ojo · aquí se sigue la clave marcada en el PDF del profesor. El fármaco es el ropinirol (en el PDF aparece escrito «ronipirol»)."}, {"id": 30, "t": "Ansiolíticos, hipnóticos y antidepresivos", "b": 1, "q": "Los barbitúricos:", "o": ["No son capaces de abrir el canal de cloro en ausencia del ligando.", "Producen sedación/ef. Hipnótico, depresión generalizada, coma y muerte, dependiendo de la dosis.", "Solo útiles en casos agudos.", "Deberían usarse más de unas pocas semanas.", "Se administran por vía oral exclusivamente."], "a": 1, "ok": "Los barbitúricos producen sedación e hipnosis, depresión generalizada del SNC, coma y muerte según la dosis.", "ko": {"0": "Sí pueden abrir el canal de cloro en ausencia de GABA (a diferencia de las benzodiazepinas).", "2": "No son solo para casos agudos.", "3": "No: se desaconseja su uso prolongado por la tolerancia y la dependencia.", "4": "No se administran exclusivamente por vía oral: también por vía parenteral."}, "n": ""}, {"id": 31, "t": "Epilepsia y Parkinson", "b": 2, "q": "La lamotrigina:", "o": ["Prolonga la inactivación rápida de los canales de sodio dependientes del voltaje", "Prolonga la inactivación lenta de los canales de sodio dependientes del voltaje", "Bloquea el transportador GAT-1", "Potencia el tono gabaérgico", "Ninguna es correcta"], "a": 0, "ok": "La lamotrigina bloquea los canales de sodio dependientes de voltaje, prolongando su inactivación rápida.", "ko": {"1": "La clave la considera falsa.", "2": "El transportador GAT-1 se bloquea con tiagabina.", "3": "Potenciar el tono GABAérgico es el mecanismo de benzodiazepinas, barbitúricos y vigabatrina.", "4": "Sí hay una opción correcta."}, "n": ""}, {"id": 32, "t": "Epilepsia y Parkinson", "b": 2, "q": "El fenobarbital:", "o": ["Es útil en epilepsia parcial, parcial con generalización y estado epiléptico", "Únicamente se administra por vía oral", "Se usa únicamente como tratamiento coadyuvante", "Es útil en crisis de ausencia", "Todas son correctas"], "a": 0, "ok": "El fenobarbital es útil en la epilepsia parcial, parcial con generalización y en el estado epiléptico.", "ko": {"1": "Se administra por vía oral y parenteral.", "2": "No se usa solo como coadyuvante.", "3": "No es útil en las crisis de ausencia.", "4": "No todas son correctas."}, "n": ""}, {"id": 33, "t": "Epilepsia y Parkinson", "b": 2, "q": "En el tratamiento de las epilepsias:", "o": ["Alrededor del 75% de los pacientes consiguen un control parcial o total con monoterapia o bien con combinaciones de fármacos", "En caso de refractariedad la alternativa es la adición de un segundo fármaco", "No se producen interacciones entre antiepilépticos", "La interrupción del tratamiento debe ser gradual", "A y D son correctas"], "a": 4, "ok": "Alrededor del 75 % de los pacientes se controla con monoterapia o combinaciones, y la interrupción debe ser gradual para evitar crisis de rebote.", "ko": {"0": "Es cierta, pero la clave la une con la otra correcta.", "1": "No es la opción marcada en la clave del profesor.", "2": "Sí se producen interacciones entre antiepilépticos.", "3": "Es cierta, pero la clave la une con la otra correcta."}, "n": ""}, {"id": 34, "t": "Epilepsia y Parkinson", "b": 2, "q": "Los inhibidores de la MAO:", "o": ["Mejoran los fenómenos on-off", "Se usan en monoterapia o asociados a L-DOPA", "Presentan hepatotoxicidad como reacción adversa", "Están representados por la tolcapona", "Ninguna es correcta"], "a": 1, "ok": "Los inhibidores de la MAO (tipo B) se usan en monoterapia o asociados a levodopa en el Parkinson.", "ko": {"0": "La clave no la marca como correcta.", "2": "La hepatotoxicidad es un efecto adverso de la tolcapona (inhibidor de COMT).", "3": "La tolcapona es un inhibidor de la COMT, no de la MAO.", "4": "Sí hay una opción correcta."}, "n": ""}, {"id": 35, "t": "Epilepsia y Parkinson", "b": 2, "q": "El ropinirol:", "o": ["Se administra por vía oral", "Presenta un mecanismo de acción no bien caracterizado", "Facilita la transmisión dopaminérgica en el estriado", "Se usa en enfermedad de Parkinson temprana o como coadyuvante", "Todas son correctas"], "a": 0, "ok": "Según la clave del profesor, la afirmación correcta es que el ropinirol se administra por vía oral.", "ko": {"1": "Su mecanismo sí está caracterizado: es un agonista dopaminérgico D2/D3.", "2": "Es un agonista dopaminérgico y por eso facilita la transmisión en el estriado; la clave marca solo la vía oral.", "3": "Se usa en el Parkinson temprano o co ica + psicoterapia."}, "n": ""}, {"id": 41, "t": "Ansiolíticos, hipnóticos y antidepresivos", "b": 2, "q": "La imipramina:", "o": ["Es un ISRS", "Bloquea SERT y NET", "Inhibe la recaptación de noradrenalina", "Bloquea SERT específicamente", "Bloquea DAT y NET"], "a": 2, "ok": "La imipramina es un antidepresivo tricíclico que inhibe la recaptación de noradrenalina.", "ko": {"0": "No es un ISRS: es un tricíclico.", "1": "Los tricíclicos bloquean también SERT y NET; aquí la clave marca la inhibición de la recaptación de noradrenalina.", "3": "Bloquear SERT específicamente es propio de los ISRS.", "4": "Bloquear DAT y NET es propio del bupropión."}, "n": "Ojo · aquí se sigue la clave marcada en el PDF del profesor. "}, {"id": 42, "t": "Ansiolíticos, hipnóticos y antidepresivos", "b": 2, "q": "Los ISRS:", "o": ["Presentan disfunción sexual como reacción adversa", "Presentan insomnio como reacción adversa", "Presentan cefalea como reacción adversa", "Ninguna es correcta", "Todas son correctas"], "a": 4, "ok": "Los ISRS producen disfunción sexual, insomnio y cefalea: todas son correctas.", "ko": {"0": "Es cierta, pero todas lo son.", "1": "Es cierta, pero todas lo son.", "2": "Es cierta, pero todas lo son.", "3": "Sí hay una opción correcta."}, "n": ""}, {"id": 43, "t": "Ansiolíticos, hipnóticos y antidepresivos", "b": 2, "q": "La terapia de la depresión:", "o": ["Presenta una proporción sustancial de remisión espontánea", "Es prolongada o indefinida en casos graves", "Solo se trata con antidepresivos", "No da problemas asociados a la retirada del tratamiento", "A y B son correctas"], "a": 4, "ok": "La depresión tiene una proporción sustancial de remisión espontánea y el tratamiento es prolongado o indefinido en casos graves.", "ko": {"0": "Es cierta, pero la clave la une con la otra correcta.", "1": "Es cierta, pero la clave la une con la otra correcta.", "2": "No solo se trata con antidepresivos: también psicoterapia.", "3": "Sí da problemas de retirada (síndrome de disc ir dependencia", "La codeína puede producir estreñimiento"], "a": 2, "ok": "El dextrometorfano no es un agonista opioide clásico (carece de efecto analgésico y de dependencia): su acción antitusiva es central pero por otro mecanismo. La codeína sí es un agonista opioide.", "ko": {"0": "Es correcta: los antitusígenos se usan en la tos no productiva.", "1": "Es correcta: el dextrometorfano tiene acción central.", "3": "Es correcta: la codeína puede producir dependencia.", "4": "Es correcta: la codeína produce estreñimiento."}, "n": "Pregunta con «INCORRECTA»: busca la afirmación falsa."}, {"id": 62, "t": "Aparato respiratorio", "b": 2, "q": "Los mucolíticos:", "o": ["Son útiles en afecciones broncopulmonares infecciosas bacterianas", "Son contraproducentes cuando la mucosa ha perdido su posibilidad de regeneración", "Son contraproducentes en fases iniciales de bronquitis crónica", "Son útiles en afecciones broncopulmonares infecciosas víricas", "Todas son correctas"], "a": 1, "ok": "Los mucolíticos son contraproducentes cuando la mucosa ha perdido su capacidad de regeneración.", "ko": {"0": "La clave no la marca como correcta.", "2": "No son contraproducentes en las fases iniciales de la bronquitis crónica: es donde más sirven.", "3": "La clave no la marca como correcta.", "4": "No todas son correctas."}, "n": ""}, {"id": 63, "t": "Aparato respiratorio", "b": 2, "q": "En el tratamiento del asma:", "o": ["La terbutalina presenta acción prolongada", "Los agonistas β2 son los broncodilatadores más eficaces", "Se utilizan los fármacos antiinflamatorios, antibióticos y broncodilatadores", "Los broncodilatadores son útiles en el tratamiento y prevención de las crisis, pero no en el mantenimiento", "A y B son correctas"], "a": 1, "ok": "Los agonistas β2 son los broncodilatadores más eficaces en el asma.", "ko": {"0": "La terbutalina es de acción corta; los de acción prolongada son salmeterol y formoterol.", "2": "Se usan antiinflamatorios (glucocorticoides) y broncodilatador  "Sí hay una opción correcta."}, "n": ""}, {"id": 70, "t": "Diabetes y tiroides", "b": 2, "q": "Señale la respuesta INCORRECTA respecto al cretinismo:", "o": ["Es esencial el control preventivo", "Hay un hipertiroidismo neonatal", "Hay un hipotiroidismo neonatal", "Debe controlarse el tratamiento con hormonas tiroideas en mujeres embarazadas", "A y B son incorrectas"], "a": 1, "ok": "En el cretinismo hay un hipotiroidismo neonatal, no hipertiroidismo.", "ko": {"0": "Es correcto: el control preventivo es esencial.", "2": "Es correcto: hay hipotiroidismo neonatal.", "3": "Es correcto: hay que controlar el tratamiento en embarazadas.", "4": "Falsa: la primera afirmación es correcta, así que no son las dos incorrectas."}, "n": ""}, {"id": 71, "t": "Diabetes y tiroides", "b": 2, "q": "El tiamazol:", "o": ["Se usa como fármaco coadyuvante en el hipertiroidismo", "Es un inhibidor de la tiroperoxidasa", "Puede producir fallo hepático como reacción adversa", "Es un inhibidor de la captación de yodo", "B y C son correctas"], "a": 4, "ok": "El tiamazol es un inhibidor de la tiroperoxidasa y puede producir fallo hepático como reacción adversa.", "ko": {"0": "Es el fármaco de elección, no solo coadyuvante.", "1": "Es cierta, pero la clave la une con la otra correcta.", "2": "Es cierta, pero la clave la une con la otra correcta.", "3": "Inhibir la captación de yodo es el mecanismo del perclorato."}, "n": ""}, {"id": 72, "t": "Diabetes y tiroides", "b": 2, "q": "El yoduro como tratamiento del hipertiroidismo:", "o": ["Reduce síntesis y liberación de hormonas tiroideas", "Puede dar lugar a citotoxicidad específica sobre tiroides", "Puede producir agranulocitosis como reacción adversa", "Su efecto dura menos de 5 días", "Todas son correctas"], "a": 0, "ok": "El yoduro reduce la síntesis y la liberación de hormonas tiroideas.", "ko": {"1": "No produce citotoxicidad específica sobre el tiroides (eso es el yodo radiactivo).", "2": "La agranulocitosis es propia de las tionamidas.", "3": "Su efecto no dura menos de 5 días.", "4": "No todas son correctas."}, "n": ""}, {"id": 73, "t": "Hormonas sexuales", "b": 2, "q": "Señale la respuesta INCORRECTA respecto a los estrógenos:", "o": ["El uso de estrógenos solos está contraindicado, excepto en caso de histerectomía previa", "La exposición excesiva a estrógenos en el embarazo puede aumentar el riesgo de cáncer en las hijas", "Los estrógenos nunca se utilizan como anticonceptivos", "Los estrógenos pueden producir deterioro cognitivo en ancianos", "Los estrógenos se pueden administrar por vía transdérmica"], "a": 2, "ok": "Los estrógenos sí se usan como anticonceptivos (solos no, combinados con progestágenos): la afirmación falsa es que nunca se usan.", "ko": {"0": "Es correcta: los estrógenos solos están contraindicados salvo histerectomía.", "1": "Es correcta: la exposición excesiva en el embarazo puede aumentar el riesgo de cáncer en las hijas.", "3": "Es correcta: pueden producir deterioro cognitivo en ancianos.", "4": "Es correcta: se pueden dar por vía transdérmica."}, "n": "Pregunta con «INCORRECTA»."}, {"id": 74, "t": "Hormonas sexuales", "b": 2, "q": "El ulipristal:", "o": ["Es un antiprogestágeno", "Es un anticonceptivo postcoital", "Es un antiandrógeno", "A y B son correctas", "Todas son correctas"], "a": 3, "ok": "El ulipristal es un antiprogestágeno (modulador selectivo del receptor de progesterona) y un anticonceptivo postcoital.", "ko": {"0": "Es cierta, pero la clave la une con la otra correcta.", "1": "Es cierta, pero la clave la une con la otra correcta.", "2": "No es un antiandrógeno.", "4": "Todas no son correctas porque una es falsa."}, "n": ""}, {"id": 75, "t": "Hormonas sexuales", "b": 2, "q": "Señale la respuesta correcta respecto a los progestágenos:", "o": ["Se utilizan como anticonceptivos simples (sin estrógenos)", "Se utilizan en mastalgias y/o mastodinia", "Se utilizan en terapia hormonal sustitutoria", "Pueden producir deterioro cognitivo en ancianos", "No son teratogénicos <script>
"use strict";
var BANK=JSON.parse(document.getElementById('bank').textContent), VARS=JSON.parse(document.getElementById('vars').textContent);
var BY={}; BANK.forEach(function(q){BY[q.id]=q;});
var VBY={}; VARS.forEach(function(v){ v.t=BY[v.b].t; VBY[v.id]=v; });
var LET='ABCDE', TEMAS=[]; BANK.forEach(function(q){ if(TEMAS.indexOf(q.t)<0) TEMAS.push(q.t); });
function $(i){return document.getElementById(i);}
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function shuffled(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>';
var ICON_KO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';
var ICON_WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>';
function ring(f,color){ var r=48,c=2*Math.PI*r; return '<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*f)+' '+c+'" transform="rotate(-90 60 60)"/></svg>'; }
function shortT(t){ return t.length>26? t.slice(0,25)+'…' : t; }

/* ---------- estado ---------- */
var KEY='farmaquiz.p2.v1';
function fresh(){ return {theme:'light',scope:'all',view:'p',ans:{},retry:{},flag:{},p:{tema:'all',mode:'all',pos:0,pending:null},sim:{cfg:{n:40,pen:0.33,min:60,mode:'cov'},hist:[],cur:null},rnd:null,vr:null,ui:{grid:true,weak:true}}; }
var ST=fresh(), mem=null;
try{ var raw=localStorage.getItem(KEY); if(raw) mem=JSON.parse(raw); }catch(e){}
if(mem){ var f=fresh(); for(var k in f){ ST[k]= (mem[k]!==undefined ? mem[k] : f[k]); } ['p','sim'].forEach(function(k){ for(var j in f[k]) if(ST[k][j]===undefined) ST[k][j]=f[k][j]; }); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} }
if(!ST.ui) ST.ui={grid:true,weak:true};
document.documentElement.setAttribute('data-theme',ST.theme);

/* ---------- utilidades ---------- */
function pool(){ return BANK.filter(function(q){ return ST.scope==='all' || String(q.b)===ST.scope; }); }
function eff(id){ return ST.retry[id]? null : (ST.ans[id]||null); }
function failedIds(){ return pool().filter(function(q){ return ST.ans[q.id] && !ST.ans[q.id].c; }).map(function(q){return q.id;}); }
function cnt(t){ return pool().filter(function(q){return q.t===t;}).length; }
function updateFailBadge(){ var n=failedIds().length, b=$('failBadge'); b.textContent=n; b.classList.toggle('zero',n===0); }
function ask(title,text,yes,cb,no,danger){
  $('mT').textContent=title; $('mP').textContent=text; $('mYes').textContent=yes; $('mNo').textContent=no||'Cancelar';
  $('mYes').className='btn '+(danger?'danger':'primary'); $('modal').classList.add('on');
  $('mYes').onclick=function(){ $('modal').classList.remove('on'); cb(); }; $('mNo').onclick=function(){ $('modal').classList.remove('on'); };
}
function feedback(q,ans){
  var f=el('div','fb'), blank=ans.s===-1;
  var head=el('div','fb-head '+(blank?'bl':(ans.c?'ok':'ko')));
  head.innerHTML= blank?ICON_WARN:(ans.c?ICON_OK:ICON_KO);
  head.appendChild(el('span',null, blank?'Sin responder · la correcta es la '+LET[q.a] : (ans.c?'¡Correcto!':'Incorrecto · la correcta es la '+LET[q.a])));
  f.appendChild(head);
  var body=el('div','fb-body');
  body.appendChild(el('h3',null,'Por qué la '+LET[q.a]+' es correcta')); body.appendChild(el('p',null,q.ok));
  if(q.n){ var n=el('div','note'); n.innerHTML=ICON_WARN; var s=el('span'); s.appendChild(el('b',null,'Ojo · ')); s.appendChild(document.createTextNode(q.n.replace(/^Ojo · /,''))); n.appendChild(s); body.appendChild(n); }
  body.appendChild(el('h3',null,'Por qué las demás no'));
  var ul=el('ul','why');
  q.o.forEach(function(text,i){ if(i===q.a) return; var li=el('li',i===ans.s?'picked':''); li.appendChild(el('span','l',LET[i])); var d=el('div'); d.appendChild(el('span','o',text)); d.appendChild(document.createTextNode(q.ko[i]||'')); li.appendChild(d); ul.appendChild(li); });
  body.appendChild(ul); f.appendChild(body); return f;
}
function optList(q,res,pend,onPick){
  var ul=el('ul','opts');
  q.o.forEach(function(text,i){
    var li=el('li'), b=el('button','opt'); b.type='button';
    b.appendChild(el('span','ltr',LET[i])); b.appendChild(el('span','txt',text));
    if(res){ b.disabled=true; if(i===q.a) b.classList.add('right'); else if(i===res.s) b.classList.add('wrong'); else b.classList.add('dim'); }
    else if(pend===i) b.classList.add('sel');
    b.addEventListener('click',function(){ if(!res) onPick(i); });
    li.appendChild(b); ul.appendChild(li);
  });
  return ul;
}

/* ================= PRACTICAR ================= */
function plist(){
  var P=ST.p;
  return pool().filter(function(q){
    if(P.tema!=='all' && q.t!==P.tema) return false;
    var a=ST.ans[q.id];
    if(P.mode==='new') return !a;
    if(P.mode==='fail') return (P.snap||failedIds()).indexOf(q.id)>=0;
    if(P.mode==='flag') return !!ST.flag[q.id];
    return true;
  }).map(function(q){return q.id;});
}
function fold(key,title,sub){
  var d=el('details','card fold'); d.open=ST.ui[key]!==false;
  var s=el('summary'); s.appendChild(el('strong',null,title)); if(sub) s.appendChild(el('small',null,sub)); d.appendChild(s);
  d.addEventListener('toggle',function(){ ST.ui[key]=d.open; save(); });
  return d;
}
function renderP(){
  var root=$('viewP'); root.textContent=''; var P=ST.p, list=plist();
  if(P.pos>=list.length) P.pos=Math.max(0,list.length-1);
  var all=pool(), done=all.filter(function(q){return ST.ans[q.id];}).length, ok=all.filter(function(q){return ST.ans[q.id]&&ST.ans[q.id].c;}).length;
  var st=el('div','stats');
  [[done+'/'+all.length,'respondidas'],[done?Math.round(ok*100/done)+'%':'—','acierto'],[ok,'aciertos'],[done-ok,'fallos']].forEach(function(s){ var d=el('div','stat'); d.appendChild(el('b',null,String(s[0]))); d.appendChild(el('span',null,s[1])); st.appendChild(d); });
  root.appendChild(st);
  var bar=el('div','controls');
  var sel=el('select'); sel.setAttribute('aria-label','Tema');
  var o0=el('option',null,'Todos los temas ('+all.length+')'); o0.value='all'; sel.appendChild(o0);
  TEMAS.forEach(function(t){ var n=cnt(t); if(!n) return; var op=el('option',null,t+' ('+n+')'); op.value=t; sel.appendChild(op); });
  sel.value=P.tema; sel.addEventListener('change',function(){ P.tema=sel.value; P.pos=0; P.pending=null; save(); renderP(); });
  var sm=el('select'); sm.setAttribute('aria-label','Estado');
  [['all','Todas'],['new','Sin contestar'],['fail','Falladas'],['flag','Marcadas']].forEach(function(m){ var op=el('option',null,m[1]); op.value=m[0]; sm.appendChild(op); });
  sm.value=P.mode;
  sm.addEventListener('change',function(){ P.mode=sm.value; P.pos=0; P.pending=null; if(P.mode==='fail'){ P.snap=failedIds(); P.snap.forEach(function(id){ ST.retry[id]=true; }); } save(); renderP(); });
  bar.appendChild(sel); bar.appendChild(sm); root.appendChild(bar);
  if(!list.length){ var e=el('div','card empty'); e.appendChild(el('h2',null,'Nada por aquí')); e.appendChild(el('p',null,'No hay preguntas con este filtro.')); root.appendChild(e); renderWeak(root); return; }
  var g=fold('grid','Mapa de preguntas',list.length+' preguntas'); var grid=el('div','grid'); grid.style.marginTop='12px';
  list.forEach(function(id,i){ var b=el('button','gcell'+(i===P.pos?' cur':''),String(i+1)); var a=eff(id); if(a) b.classList.add(a.c?'ok':'ko'); if(ST.flag[id]) b.classList.add('fl'); b.addEventListener('click',function(){ P.pos=i; P.pending=null; save(); renderP(); }); grid.appendChild(b); });
  g.appendChild(grid);
  var id=list[P.pos], q=BY[id], a=eff(id), pend=P.pending&&P.pending.id===id?P.pending.sel:null;
  var card=el('article','card qcard x'), meta=el('div','qmeta'); meta.appendChild(el('span','tag',q.t)); meta.appendChild(el('span','qnum','Pregunta '+(P.pos+1)+' de '+list.length+' · nº '+id)); card.appendChild(meta);
  card.appendChild(el('h2','qtext',q.q));
  card.appendChild(optList(q,a,pend,function(i){ P.pending={id:id,sel:i}; save(); renderP(); }));
  var act=el('div','actions');
  var pv=el('button','btn ghost','← Anterior'); pv.disabled=P.pos===0; pv.addEventListener('click',function(){ pGo(P.pos-1); }); act.appendChild(pv);
  var fl=el('button','btn ghost',ST.flag[id]?'★ Marcada':'☆ Marcar'); fl.addEventListener('click',function(){ if(ST.flag[id]) delete ST.flag[id]; else ST.flag[id]=true; save(); renderP(); }); act.appendChild(fl);
  act.appendChild(el('span','sp'));
  if(!a){ var ck=el('button','btn primary','Comprobar'); ck.disabled=pend==null; ck.addEventListener('click',pCheck); act.appendChild(ck); }
  var nx=el('button','btn '+(a?'primary':'ghost'),'Siguiente →'); nx.disabled=P.pos>=list.length-1; nx.addEventListener('click',function(){ pGo(P.pos+1); }); act.appendChild(nx);
  card.appendChild(act);
  card.appendChild(el('p','hint','Atajos: A–E para elegir, Enter para comprobar / seguir, ← → para moverte.'));
  if(a) card.appendChild(feedback(q,a));
  root.appendChild(card);
  root.appendChild(g);
  renderWeak(root);
}
function renderWeak(root){
  var rows=TEMAS.filter(function(t){return cnt(t);}).map(function(t){ var qs=pool().filter(function(q){return q.t===t;}), ok=0,ko=0; qs.forEach(function(q){ var a=ST.ans[q.id]; if(a){ if(a.c) ok++; else ko++; } }); return {t:t,n:qs.length,ok:ok,ko:ko}; });
  rows.sort(function(a,b){ return (a.ok/a.n)-(b.ok/b.n); });
  var p=fold('weak','Por tema (de más flojo a más fuerte)'); var w=el('div','weak'); w.style.marginTop='12px';
  rows.forEach(function(a){ var row=el('div','wrow'); row.appendChild(el('span',null,shortT(a.t))); row.title=a.t; var b=el('div','sbar'); [['g',a.ok],['r',a.ko],['n',a.n-a.ok-a.ko]].forEach(function(s){ var i=el('i',s[0]); i.style.width=(s[1]*100/a.n)+'%'; b.appendChild(i); }); row.appendChild(b); row.appendChild(el('span','pc',a.ok+'/'+a.n)); w.appendChild(row); });
  p.appendChild(w); root.appendChild(p);
}
function pGo(i){ var list=plist(); if(i<0||i>=list.length) return; ST.p.pos=i; ST.p.pending=null; save(); renderP(); window.scrollTo({top:0,behavior:'smooth'}); }
function pCheck(){
  var P=ST.p, list=plist(), id=list[P.pos]; if(id==null||!P.pending||P.pending.id!==id||eff(id)) return;
  var sel=P.pending.sel; ST.ans[id]={s:sel,c:sel===BY[id].a}; delete ST.retry[id]; P.pending=null; save(); updateFailBadge(); renderP();
  var fb=document.querySelector('#viewP .fb'); if(fb&&fb.scrollIntoView) fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ================= SIMULACRO ================= */
var tmr=null, sv='start', resId=null, rvFilter='all';
function allocate(ids,n){
  var by={}; ids.forEach(function(id){ var t=BY[id].t; (by[t]=by[t]||[]).push(id); });
  var ts=Object.keys(by), tot=ids.length, q={}, used=0, rem=[];
  ts.forEach(function(t){ var x=by[t].length*n/tot; q[t]=Math.floor(x); used+=q[t]; rem.push([t,x-q[t]]); });
  rem.sort(function(a,b){return b[1]-a[1];}); for(var i=0;used<n&&i<rem.length;i++,used++) q[rem[i][0]]++;
  var out=[]; ts.forEach(function(t){ out=out.concat(shuffled(by[t]).slice(0,q[t])); }); return shuffled(out);
}
function simPool(){
  var c=ST.sim.cfg, ids=pool().map(function(q){return q.id;});
  if(c.mode==='fail'){ var f=failedIds(); if(f.length) ids=f; }
  if(c.mode==='new'){ var nn=ids.filter(function(id){return !ST.ans[id];}); if(nn.length) ids=nn; }
  return ids;
}
function startExam(){
  var c=ST.sim.cfg, ids=simPool(), n=Math.min(+c.n||40,ids.length);
  ST.sim.cur={id:Date.now(),start:Date.now(),min:+c.min||0,pen:+c.pen||0,order:allocate(ids,n),ans:{},flag:{},pos:0};
  sv='exam'; save(); renderS(); startTimer();
}

    var v=view(id),sel=r.pending.sel,orig=v.perm[sel],ok=sel===v.a; r.res[id]={s:orig,c:ok};

  var root=$('viewF'); root.textContent=''; var ids=failedIds();
  root.appendChild(el('h2','sim-h','Mis fallos')); root.appendChild(el('p','sim-p','Todas las preguntas que has fallado por última vez, con la respuesta correcta y la explicación, para leerlas y no repetir el error.'));
  if(!ids.length){ var e=el('div','card empty'); e.appendChild(el('h2',null,'Sin fallos pendientes')); e.appendChild(el('p',null,'Cuando falles preguntas en cualquier pestaña aparecerán aquí.')); root.appendChild(e); return; }
  var al=el('div','rline'); var pb=el('button','btn primary','Reintentarlas ('+ids.length+')'); pb.addEventListener('click',function(){ ids.forEach(function(id){ ST.retry[id]=true; }); ST.p.mode='fail'; ST.p.snap=ids.slice(); ST.p.tema='all'; ST.p.pos=0; ST.p.pending=null; save(); setView('p'); }); al.appendChild(pb); root.appendChild(al);
  TEMAS.forEach(function(t){
    var g=ids.filter(function(id){return BY[id].t===t;}); if(!g.length) return;
    root.appendChild(el('h2',null,t+' ('+g.length+')'));
    g.forEach(function(id){
      var q=BY[id], a=ST.ans[id], d=el('details','rv'), s=el('summary'); s.appendChild(el('span','st ko','✕')); s.appendChild(el('span',null,q.q)); d.appendChild(s);
      var b=el('div','rvb'); b.appendChild(optList(q,a,null,function(){})); b.appendChild(feedback(q,a)); d.appendChild(b); root.appendChild(d);
    });
  });
}

/* ================= vistas y eventos ================= */
function applyView(){
  var v=ST.view; if('psrvf'.indexOf(v)<0) v='p';
  ['P','S','R','V','F'].forEach(function(k){ var on=(v===k.toLowerCase()); $('view'+k).hidden=!on; $('tab'+k).setAttribute('aria-selected',String(on)); });
  $('liveDot').classList.toggle('on',!!ST.sim.cur); updateFailBadge();
  if(v==='p') renderP(); if(v==='s') renderS(); if(v==='r') RND.render(); if(v==='v') VAR.render(); if(v==='f') renderF();
}
function setView(v){ ST.view=v; save(); applyView(); window.scrollTo({top:0}); }
['P','S','R','V','F'].forEach(function(k){ $('tab'+k).addEventListener('click',function(){ setView(k.toLowerCase()); }); });
var sc=$('scope'); [['all','Todo el material (temas 9-28)'],['1','Parcial · temas 9-19'],['2','Enero · temas 20-28']].forEach(function(o){ var op=el('option',null,o[1]); op.value=o[0]; sc.appendChild(op); });
sc.value=ST.scope; sc.addEventListener('change',function(){ ST.scope=sc.value; ST.p.pos=0; ST.p.pending=null; ST.p.tema='all'; ST.rnd=null; ST.vr=null; save(); applyView(); });
$('btnTheme').addEventListener('click',function(){ ST.theme=ST.theme==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',ST.theme); save(); });
$('btnReset').addEventListener('click',function(){ ask('¿Reiniciar todo el progreso?','Se borrarán tus respuestas, marcas, simulacros e historial.','Sí, reiniciar',function(){ var th=ST.theme; ST=fresh(); ST.theme=th; sv='start'; stopTimer(); save(); sc.value='all'; applyView(); },'Cancelar',true); });
if(ST.rnd&&!RND.valid()) ST.rnd=null; if(ST.vr&&!VAR.valid()) ST.vr=null;
if(ST.sim.cur){ var bad=ST.sim.cur.order.some(function(id){return !BY[id];}); if(bad) ST.sim.cur=null; else { sv='exam'; if(ST.view==='s') startTimer(); } }
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return; if($('modal').classList.contains('on')){ if(e.key==='Escape') $('modal').classList.remove('on'); return; }
  var tg=e.target&&e.target.tagName; if(tg==='SELECT'||tg==='INPUT') return;
  var h=false;
  if(ST.view==='r') h=RND.key(e); else if(ST.view==='v') h=VAR.key(e);
  else if(ST.view==='s'&&sv==='exam'&&ST.sim.cur){ var c=ST.sim.cur,id=c.order[c.pos],q=BY[id],k=e.key.toLowerCase(),ix='abcde'.indexOf(k);
    if(k.length===1&&ix>=0&&ix<q.o.length){ if(c.ans[id]===ix) delete c.ans[id]; else c.ans[id]=ix; save(); renderS(); h=true; }
    else if(e.key==='ArrowRight'&&c.pos<c.order.length-1){ c.pos++; save(); renderS(); h=true; } else if(e.key==='ArrowLeft'&&c.pos>0){ c.pos--; save(); renderS(); h=true; } }
  else if(ST.view==='p'){ var list=plist(),pid=list[ST.p.pos]; if(pid==null) return; var q2=BY[pid],k2=e.key.toLowerCase(),i2='abcde'.indexOf(k2),a2=eff(pid);
    if(k2.length===1&&i2>=0&&i2<q2.o.length&&!a2){ ST.p.pending={id:pid,sel:i2}; save(); renderP(); h=true; }
    else if(/^[1-5]$/.test(k2)&&+k2<=q2.o.length&&!a2){ ST.p.pending={id:pid,sel:+k2-1}; save(); renderP(); h=true; }
    else if(e.key==='Enter'){ if(!a2) pCheck(); else pGo(ST.p.pos+1); h=true; }
    else if(e.key==='ArrowRight'){ pGo(ST.p.pos+1); h=true; } else if(e.key==='ArrowLeft'){ pGo(ST.p.pos-1); h=true; } }
  if(h) e.preventDefault();
});
applyView();
</script>
